name: "Python FastAPI Clean Service"
description: "Hexagonal Python service with Pydantic v2 domain models, repository ports, SQLAlchemy async adapters, and FastAPI routers"
language: "Python"
framework: "FastAPI"
build: "pytest"
package_manager: "uv/pip"

directories:
  - "app/domain/"
  - "app/ports/"
  - "app/services/"
  - "app/adapters/persistence/"
  - "app/routers/"
  - "tests/unit/"
  - "tests/contract/"

templates:
  pyproject.toml.template: "{module_kebab}/pyproject.toml"
  main.py.template: "{module_kebab}/app/main.py"

entity_stubs:
  domain: "app/domain/{entity_snake}.py"
  domain_test: "tests/unit/test_{entity_snake}_domain.py"
  service: "app/services/{entity_snake}_service.py"
  adapter: "app/adapters/persistence/{entity_snake}_repository.py"
  router: "app/routers/{entity_snake}_router.py"

default_files:
  - "{module_kebab}/app/__init__.py"
  - "{module_kebab}/app/domain/exceptions.py"
  - "{module_kebab}/app/ports/repository.py"

# Python FastAPI Scaffold
# Used when LLD Project Structure maps a module to scaffold: python-fastapi

name: "Python FastAPI Service"
description: "Python service with FastAPI, Pydantic models, clean architecture"
language: "Python"
framework: "FastAPI"
build: "uvicorn"
package_manager: "pip/poetry"

directories:
  - app/
  - app/routers/
  - app/services/
  - app/models/
  - app/schemas/
  - tests/

templates:
  pyproject.toml.template: "{module}/pyproject.toml"
  main.py.template: "{module}/app/main.py"

entity_stubs:
  router: "app/routers/{entity_lower}.py"
  service: "app/services/{entity_lower}.py"
  model: "app/models/{entity_lower}.py"
  schema: "app/schemas/{entity_lower}.py"
  test: "tests/test_{entity_lower}.py"

default_files:
  - "{module}/app/__init__.py"
  - "{module}/app/routers/__init__.py"
  - "{module}/app/services/__init__.py"
  - "{module}/app/models/__init__.py"
  - "{module}/tests/__init__.py"

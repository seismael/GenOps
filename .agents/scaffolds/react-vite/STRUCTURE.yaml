# React + Vite Scaffold
# Used when LLD Project Structure maps a module to scaffold: react-vite

name: "React + Vite Application"
description: "React 19 with TypeScript, Vite build tool, component-based structure"
language: "TypeScript"
framework: "React 19"
build: "vite build"
package_manager: "pnpm"

directories:
  - src/components/
  - src/pages/
  - src/hooks/
  - src/services/
  - src/types/
  - src/styles/
  - public/

templates:
  package.json.template: "{module}/package.json"
  tsconfig.json.template: "{module}/tsconfig.json"
  vite.config.ts.template: "{module}/vite.config.ts"

entity_stubs:
  component: "src/components/{Entity}.tsx"
  page: "src/pages/{Entity}Page.tsx"
  service: "src/services/{entity_lower}Service.ts"
  type: "src/types/{entity_lower}.ts"

default_files:
  - "{module}/src/App.tsx"
  - "{module}/src/main.tsx"
  - "{module}/index.html"

name: "Node.js TypeScript Clean Service"
description: "TypeScript microservice with Express, Zod contract validation, ports & adapters, and Vitest"
language: "TypeScript"
framework: "Express"
build: "npm test"

directories:
  - "src/domain/"
  - "src/ports/"
  - "src/services/"
  - "src/adapters/"
  - "src/controllers/"
  - "tests/unit/"
  - "tests/contract/"

templates:
  package.json.template: "{module_kebab}/package.json"
  tsconfig.json.template: "{module_kebab}/tsconfig.json"
  index.ts.template: "{module_kebab}/src/index.ts"
  Dockerfile.template: "{module_kebab}/Dockerfile"

entity_stubs:
  domain: "src/domain/{entity_kebab}.ts"
  domain_test: "tests/unit/{entity_kebab}.test.ts"
  controller: "src/controllers/{entity_kebab}.controller.ts"
  service: "src/services/{entity_kebab}.service.ts"

default_files:
  - "{module_kebab}/src/domain/errors.ts"
  - "{module_kebab}/src/ports/repository.port.ts"

[project]
name = "genops"
version = "3.1.2"
description = "Zero-dependency agent-native specification pipeline and governance engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.ruff]
target-version = "py38"
line-length = 120
src = [".agents/scripts", "tests"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
files = [".agents/scripts/genops.py", ".agents/scripts/install_global.py", "tests"]
